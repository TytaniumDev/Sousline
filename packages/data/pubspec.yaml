name: data
description: >-
  Drift database schema, DAOs, and repository implementations for Sousvite.
  Pure Dart: the Flutter app opens the database connection and passes it in.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  domain: any
  drift: ^2.35.4
  sync: any

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  sqlite3: ^3.9.1
  test: ^1.30.0
  very_good_analysis: ^11.0.0
